query Input {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      attribute(key: "VAT Relief") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          selectedOptions {
            name
            value
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
