name: Storefront 1000159321
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate storefront types
        run: npm run codegen

      - name: Check types and storefront behaviour
        run: |
          npm run typecheck
          npm test

      # Validation updates these tracked generated outputs. Hydrogen generates
      # fresh types again during its build; publish from the committed source.
      - name: Restore generated validation outputs
        run: git restore -- storefrontapi.generated.d.ts tsconfig.tsbuildinfo

      - name: Build and Publish to Oxygen
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            npx shopify hydrogen deploy
          else
            npx shopify hydrogen deploy --preview
          fi
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000159321 }}
